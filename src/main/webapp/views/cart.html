<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Fashion Store</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="home.html">👗 FashionStore</a>
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="product-list.html?categoryId=2">Women</a></li>
                <li><a href="product-list.html?categoryId=1">Men</a></li>
                <li><a href="product-list.html?categoryId=3">Kids</a></li>
            </ul>
            <div class="nav-icons">
                <a href="cart.html" class="icon-btn cart-icon">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <a href="login.html" class="icon-btn" id="loginBtn">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="cart-container">
        <h2>Your Shopping Cart</h2>
        <div id="cartItems" class="cart-items">
            <h3 style="text-align:center; padding: 40px;">Loading your cart...</h3>
        </div>
        <div class="cart-summary" id="cartSummary" style="display:none;">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cartSubtotal">&#8377;0</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span id="cartTotal">&#8377;0</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
