<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fashion Store</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="home.html">Fashion Store</a>
            </div>
            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="product-list.html">Products</a>
            </div>
            <div class="nav-icons">
                <a href="cart.html" class="icon-btn" style="position:relative;">Cart
                    <span id="cartCount" class="cart-count">0</span>
                </a>
                <a href="login.html" class="icon-btn">Login</a>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <p>Log in to access your account</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <div class="register-link">
            Don't have an account? <a href="register.html">Sign up here</a>
        </div>
    </div>

    <script src="../assets/js/login.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
