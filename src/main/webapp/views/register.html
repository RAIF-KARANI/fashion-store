<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Fashion Store</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="home.html">Fashion Store</a>
            </div>
            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="product-list.html">Products</a>
            </div>
            <div class="nav-icons">
                <a href="cart.html" class="icon-btn" style="position:relative;">Cart
                    <span id="cartCount" class="cart-count">0</span>
                </a>
                <a href="login.html" class="icon-btn">Login</a>
            </div>
        </div>
    </nav>

    <div class="login-container" style="max-width: 600px;">
        <h2>Create an Account</h2>
        <p>Join the Fashion Store community</p>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" required placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" required placeholder="Enter your full address">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Create a password">
            </div>
            <button type="submit" class="login-btn">Sign Up</button>
        </form>
        <div class="register-link">
            Already have an account? <a href="login.html">Log in here</a>
        </div>
    </div>

    <script src="../assets/js/register.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
